<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Prediksi Iris - C4.5</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🌸 Prediksi Jenis Bunga Iris (C4.5)</h1>
        <form action="/predict" method="post">
            <label>Sepal Length (cm):</label>
            <input type="number" step="0.1" name="sepalLength" required>

            <label>Sepal Width (cm):</label>
            <input type="number" step="0.1" name="sepalWidth" required>

            <label>Petal Length (cm):</label>
            <input type="number" step="0.1" name="petalLength" required>

            <label>Petal Width (cm):</label>
            <input type="number" step="0.1" name="petalWidth" required>

            <button type="submit">Prediksi</button>
        </form>

        {% if prediction %}
            <div class="result">
                <h3>Hasil Prediksi:</h3>
                <p>{{ prediction }}</p>
                <img src="{{ url_for('static', filename=image) }}" alt="Flower Image" width="250">
            </div>
        {% endif %}
    </div>
</body>
</html>
